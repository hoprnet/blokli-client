[workspace]

resolver = "2"

members = ["client", "inspector", "tests/integration"]

[workspace.dependencies]
anyhow             = "1.0.103"
async-broadcast    = "0.7.2"
async-trait        = "0.1.89"
blokli-client      = { path = "client", version = "0.30.3" }
bytes              = "1.12.1"
chrono             = "0.4.45"
clap               = { version = "4.6.1", features = ["derive", "env", "string"] }
comfy-table        = { version = "7.2.2", default-features = false }
cynic              = "3.13.2"
cynic-codegen      = "3.13.2"
eventsource-client = { version = "0.17.5", default-features = false }
futures            = "0.3.32"
futures-time       = "3.1.0"
hex                = "0.4.3"
hopli              = { git = "https://github.com/hoprnet/hopli", branch = "main" }
hopr-bindings      = "4.13.0"
hopr-types         = "2.3.0"

http = "1.4.2"
indexmap = "2.14.0"
insta = { version = "1.48.0", features = ["yaml"] }
launchdarkly-sdk-transport = "0.1.4"
libc = "0.2.186"
mockito = "1.7.2"
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
rstest = "0.26.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
serial_test = "3.5.0"
smart-default = "0.7.1"
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "tracing",
] }
toml_edit = { version = "=0.25.12", features = ["serde"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "registry",
  "std",
] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }

[profile.dev]
panic = "abort"

# this profile focuses on the speed of compilation
[profile.candidate]
codegen-units = 16        # normal release default
inherits      = "release"
lto           = false     # do the smallest amount of link-time optimization
opt-level     = 2
panic         = "abort"
strip         = true

# perform minimal optimizations to prevent stack overflows in large tests
[profile.test]
opt-level = 1

# CI keeps line-level backtraces while avoiding large incremental and full
# debug-info artifacts in the Nix binary cache.
[profile.ci-test]
debug       = 1
incremental = false
inherits    = "test"

# this profile focuses on the best runtime performance and the smallest binary size
[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = true

# Workspace-level lints to prevent common issues
[workspace.lints.clippy]
# Prevent lossy numeric casts that can cause data corruption
cast_possible_truncation = "deny"
cast_possible_wrap       = "deny"
cast_sign_loss           = "deny"

# faster insta test runs
[profile.dev.package]
insta.opt-level   = 3
similar.opt-level = 3
