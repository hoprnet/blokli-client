[package]
description   = "Client connector to Blokli"
documentation = "https://docs.rs/blokli-client"
edition       = "2024"
homepage      = "https://hoprnet.org/"
license       = "GPL-3.0-only"
name          = "blokli-client"
readme        = "README.md"
repository    = "https://github.com/hoprnet/blokli-client"
version       = "0.32.0"

[dependencies]
anyhow          = { workspace = true }
async-broadcast = { workspace = true, optional = true }
async-trait     = { workspace = true }
bytes           = { workspace = true }
chrono          = { workspace = true, optional = true }
cynic           = { workspace = true, features = ["http-reqwest"] }
# Use custom reqwest transport (no built-in hyper transport).
eventsource-client = { workspace = true }
futures = { workspace = true }
futures-time = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true, optional = true }
launchdarkly-sdk-transport = { workspace = true }
parking_lot = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = [
  "brotli",
  "deflate",
  "gzip",
  "json",
  "stream",
  "zstd",
] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
smart-default = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["release_max_level_debug"] }
url = { workspace = true }

hopr-types = { workspace = true, features = ["crypto", "primitive"] }

[features]
serde = ["dep:serde", "indexmap/serde"]
testing = [
  "dep:async-broadcast",
  "dep:chrono",
  "dep:indexmap",
  "dep:parking_lot",
  "dep:rand",
  "serde",
]

[build-dependencies]
cynic-codegen = { workspace = true }

[dev-dependencies]
anyhow      = { workspace = true }
insta       = { workspace = true, features = ["json", "yaml"] }
mockito     = { workspace = true }
parking_lot = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true, features = ["preserve_order"] }
tokio       = { workspace = true }

# `cynic-codegen` is a build-dependency used only in `build.rs` (GraphQL schema
# registration). cargo-machete does not scan build scripts, so it reports it as unused.
[package.metadata.cargo-machete]
ignored = ["cynic-codegen"]

[package.metadata.docs.rs]
all-features = true
