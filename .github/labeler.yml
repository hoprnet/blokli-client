---
toolchain:
  - changed-files:
      - any-glob-to-any-file:
          - flake.*
          - "*.nix"
          - .github/**
          - rust-toolchain.toml
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.lock
          - "**/Cargo.toml"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
crate:blokli-client:
  - changed-files:
      - any-glob-to-any-file: client/**
helm:
  - changed-files:
      - any-glob-to-any-file: charts/**
docker:
  - changed-files:
      - any-glob-to-any-file: docker/**
