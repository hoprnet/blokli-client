---
################################################################################
# Pull request pipeline for blokli-client
#
# Validates PR metadata, runs code-quality checks and tests via shared
# workflows, then builds the client library.
################################################################################
name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # ── PR metadata ──────────────────────────────────────────────────────────────
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04-2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  # ── Path filter ──────────────────────────────────────────────────────────────
  # Gate jobs through inputs on the reusable workflows, not with a caller-level
  # `if:`: an input-skipped inner job still reports its required check name as
  # skipped (green), a skipped caller job does not. Merge-queue runs always
  # run everything.
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "client/**"
              - "inspector/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - ".cargo/**"
              - ".config/**"
              - "flake.nix"
              - "flake.lock"
              - "nix/**"
              - "justfile"
              - "codecov.yml"
              - ".github/workflows/**"
            lockfile:
              - "Cargo.toml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - ".cargo/audit.toml"
  # ── Shared checks (lint, pre-commit, audit) ─────────────────────────────────
  checks:
    name: Check
    needs: changes
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-checks-v2.1.1
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      cachix_cache_name: blokli-client
      lint_command: "nix build -L .#clippy"
      audit_command: "nix run -L .#audit"
      deps: true
      # Format and pre-commit cover every file type and always run.
      lint: ${{ needs.changes.outputs.rust == 'true' }}
      audit: ${{ needs.changes.outputs.lockfile == 'true' }}
      runner_small: depot-ubuntu-24.04-2
      runner_large: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # ── Shared tests (unit + integration) ───────────────────────────────────────
  # Stage 2: runs only after the stage 1 checks are green.
  tests:
    name: Test
    needs: [changes, checks]
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-tests-v6.1.1
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage job
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      cachix_cache_name: blokli-client
      enable_unit_tests: false
      enable_unit_coverage: ${{ needs.changes.outputs.rust == 'true' }}
      unit_coverage_command: "nix build -L .#coverage -o coverage.lcov"
      enable_integration_tests: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      integration_test_command: "nix run -L .#test-integration"
      runner_integration: depot-ubuntu-24.04-4
      test_timeout: 30
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # ── Build: library ─────────────────────────────────────────────────────────
  # Stage 3: runs only after checks and tests are green. `tests` reports
  # skipped when its path filter is false or on a fork draft PR, and a plain
  # `needs` would skip this job with it. `!failure()` still stops the build on
  # any failed or cancelled upstream job.
  build-library:
    name: Library ${{ matrix.architecture }}
    needs: [changes, checks, tests]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-4
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-4
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15
            required_label: "binary:aarch64-darwin"
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@bfdfd56e110ee356595faac1424b74906ed50ac9 # build-library-v3.3.2
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: blokli-client
      build_file: client/Cargo.toml
      # Cached crane build; the callee then runs `cargo release` with `--no-verify`.
      build_command: "nix build -L .#lib-blokli-client-${{ matrix.architecture }}"
      # No `package_name`, so the publish dry-run covers the whole workspace
      # (`cargo release publish --workspace`), matching the release workflow.
      runner: ${{ matrix.runner }}
      enabled: ${{ needs.changes.outputs.rust == 'true' && (matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label)) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in the branch ruleset, so
  # adding, renaming, or removing a job never needs a ruleset change.
  # `if: always()` runs it even when a dependency fails; alls-green then reds
  # the gate on any non-success (a failed job, or a skip that is not allowed).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - label
      - changes
      - checks
      - tests
      - build-library
    runs-on: depot-ubuntu-24.04-2
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # validate-pr-title and label run on pull_request only. `tests` and
          # `build-library` are input-gated on `changes.outputs.rust`; when
          # every inner job of the reusable workflow skips, the caller job
          # reports skipped as well. Their skip is allowed only for a non-Rust
          # change; a Rust change still has to run both. A failed job reds the
          # gate either way.
          allowed-skips: ${{ needs.changes.outputs.rust == 'true' && 'validate-pr-title, label' || 'validate-pr-title, label, tests, build-library' }}
