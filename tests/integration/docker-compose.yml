---
# The integration image embeds Anvil, deploys the HOPR contracts, and starts
# Blokli. BLOKLI_TEST_REMOTE_IMAGE selects either the standard or Curvy image.
services:
  bloklid:
    image: ${BLOKLID_IMAGE:-bloklid-anvil:integration-test}
    container_name: blokli-${STACK_ID:-default}-bloklid
    environment:
      ANVIL_HOST: 0.0.0.0
      BLOKLI_INDEXER_ENABLE_SAFE_INDEXING: "true"
      RUST_LOG: trace
    ports:
      - "${ANVIL_PORT:-8546}:8545"
      - "${BLOKLID_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8080/healthz && curl -sf http://localhost:8080/readyz | grep -q '\"status\":\"ready\"'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
