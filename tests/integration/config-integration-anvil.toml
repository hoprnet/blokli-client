# Integration test configuration for bloklid
# This configuration is used for integration testing with Docker Compose
# It connects to Anvil through the Docker network. 

# Directory for storing data files
data_directory = "/data"

# Network identifier - using "anvil-localhost" for local testing
network = "anvil-localhost"

# RPC endpoint URL - connects to Anvil service
rpc_url = "http://anvil:8546"

# Maximum number of RPC requests per second (0 for unlimited)
max_rpc_requests_per_sec = 0

# Contract addresses produced by hopr-bindings for the deterministic Anvil deployer
[contracts]
announcements              = "0x8A791620dd6260079BF849Dc5567aDC3F2FdC318"
channels                   = "0xa513E6E4b8f2a923D98304ec87F64353C4D5C853"
module_implementation      = "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
node_safe_migration        = "0xB7f8BC63BbcaD18155201308C8f3540b07f84F5e"
node_safe_registry         = "0x0165878A594ca255338adfa4d48449f69242Eb8F"
node_stake_factory         = "0x610178dA211FEF7D417bC0e6FeD39F05609AD788"
ticket_price_oracle        = "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"
token                      = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
winning_probability_oracle = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
xhopr_token                = "0xA51c1fc2f0D1a1b8494Ed1FE312d7C3a78Ed91C0"

# PostgreSQL database configuration
[database]
type = "postgresql"
url  = "postgresql://bloklid:bloklid_integration_test@postgres:5432/bloklid"

# Indexer configuration
[indexer]
# Disable fast sync for integration tests - we want to test normal startup
fast_sync = false

# Disable logs snapshot for integration tests
enable_logs_snapshot = false

# Enable safe indexing
enable_safe_indexing = true

# GraphQL subscription configuration
[indexer.subscription]
batch_size               = 50
event_bus_capacity       = 100
shutdown_signal_capacity = 10

# API server configuration
[api]
bind_address       = "0.0.0.0:8081"
enabled            = true
playground_enabled = true

[api.sse_keepalive]
enabled  = true
interval = "1s"
text     = "keep-alive"

# Health check configuration
[api.health]
# Allow higher lag for integration tests since we're starting from scratch
max_indexer_lag = 1
timeout         = "5s"
